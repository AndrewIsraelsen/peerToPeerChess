<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chess Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>P2P Chess Game</h1>
            <div class="connection-status" id="connection-status">
                <span class="status-indicator" id="status-indicator">●</span>
                <span id="status-text">Offline</span>
            </div>
        </header>

        <div class="game-info">
            <div class="player-info">
                <div class="player white-player">
                    <span class="player-name" id="white-player-name">White Player</span>
                    <span class="player-status" id="white-status">Local</span>
                </div>
                <div class="player black-player">
                    <span class="player-name" id="black-player-name">Black Player</span>
                    <span class="player-status" id="black-status">Local</span>
                </div>
            </div>

            <div class="game-controls">
                <button id="create-game-btn">Create Game</button>
                <button id="join-game-btn">Join Game</button>
                <button id="new-game-btn">New Game</button>
                <button id="resign-btn">Resign</button>
            </div>
        </div>

        <main>
            <div class="game-board-container">
                <div id="chess-board" class="chess-board">
                    <!-- Board squares will be generated by JavaScript -->
                </div>

                <div class="captured-pieces">
                    <div class="captured-white">
                        <h3>Captured White</h3>
                        <div id="captured-white-pieces"></div>
                    </div>
                    <div class="captured-black">
                        <h3>Captured Black</h3>
                        <div id="captured-black-pieces"></div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="game-status">
                    <div id="turn-indicator">White's Turn</div>
                    <div id="game-messages"></div>
                </div>

                <div class="connection-panel" id="connection-panel">
                    <h3>Connection</h3>
                    <div id="local-offer" style="display: none;">
                        <h4>Share this code with your opponent:</h4>
                        <textarea id="offer-code" readonly onclick="this.select()"></textarea>
                        <button onclick="copyToClipboard('offer-code')">Copy</button>
                    </div>

                    <div id="remote-answer" style="display: none;">
                        <h4>Paste opponent's answer:</h4>
                        <textarea id="answer-input" placeholder="Paste answer here..."></textarea>
                        <button id="connect-answer-btn">Connect</button>
                    </div>

                    <div id="join-offer" style="display: none;">
                        <h4>Paste game code:</h4>
                        <textarea id="offer-input" placeholder="Paste offer here..."></textarea>
                        <button id="join-offer-btn">Join Game</button>
                    </div>

                    <div id="local-answer" style="display: none;">
                        <h4>Send this answer back:</h4>
                        <textarea id="answer-code" readonly onclick="this.select()"></textarea>
                        <button onclick="copyToClipboard('answer-code')">Copy</button>
                    </div>
                </div>

                <div class="chat-panel" id="chat-panel" style="display: none;">
                    <h3>Chat</h3>
                    <div id="chat-messages"></div>
                    <div class="chat-input-container">
                        <input type="text" id="chat-input" placeholder="Type message..." maxlength="200">
                        <button id="send-chat-btn">Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
